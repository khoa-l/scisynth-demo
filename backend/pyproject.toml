[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "scisynth",
    "plotly>=7.1.0",
    "uvicorn[standard]>=0.54.0",
    "scikit-learn>=1.9.1",
    "umap-learn>=0.5.12",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
]

[tool.uv.sources]
scisynth = { git = "https://github.com/khoa-l/scisynth.git", branch = "main" }
