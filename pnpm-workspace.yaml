  "@tanstack/vue-form": ^1.33.5
  "@tanstack/vue-query": ^5.105.0
  "@types/node": ^24
  "@types/plotly.js": ^3.0.15
  "@vue-dnd-kit/core": ^3.0.0
  "@vue-flow/background": ^1.3.2
  "@vue-flow/core": ^1.48.2
  "@vueuse/core": ^15.0.0
  class-variance-authority: ^0.7.1
  cn: ^0.5.1
  plotly.js-cartesian-dist-min: ^4.2.0
  reka-ui: ^2.11.0
  shadcn-vue: ^2.9.0
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
